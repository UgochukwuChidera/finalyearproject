<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0f172a" />
  <title>DAPE | AI Form Pipeline</title>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  {% block styles %}{% endblock %}
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">D</div>
        <h1>DAPE</h1>
      </div>
      <nav>
        <ul class="nav-links">
          <li>
            <a href="{{ url_for('web.index') }}" class="{{ 'active' if request.endpoint == 'web.index' }}">
              <i class="ph ph-squares-four"></i>
              <span>Dashboard</span>
            </a>
          </li>
          <li>
            <a href="{{ url_for('web.configs_page') }}" class="{{ 'active' if 'config' in request.endpoint }}">
              <i class="ph ph-gear"></i>
              <span>Configurations</span>
            </a>
          </li>
          <li>
            <a href="{{ url_for('web.jobs') }}" class="{{ 'active' if request.endpoint == 'web.jobs' }}">
              <i class="ph ph-list-bullets"></i>
              <span>Job Queue</span>
            </a>
          </li>
          <li>
            <a href="{{ url_for('web.audits') }}" class="{{ 'active' if request.endpoint == 'web.audits' }}">
              <i class="ph ph-scroll"></i>
              <span>Audit Stream</span>
            </a>
          </li>
          <li>
            <a href="{{ url_for('web.evaluation') }}" class="{{ 'active' if request.endpoint == 'web.evaluation' }}">
              <i class="ph ph-chart-bar"></i>
              <span>Evaluation</span>
            </a>
          </li>
          <li>
            <a href="{{ url_for('web.settings') }}" class="{{ 'active' if request.endpoint == 'web.settings' }}">
              <i class="ph ph-sliders"></i>
              <span>Model Settings</span>
            </a>
          </li>
          <li style="margin-top: auto">
            <a href="#" class="ghost">
              <i class="ph ph-question"></i>
              <span>Help Center</span>
            </a>
          </li>
        </ul>
      </nav>
    </aside>

    <main class="main-content">
      {% block content %}{% endblock %}
    </main>
  </div>

  <div id="toast-container" style="position: fixed; top: 2rem; right: 2rem; z-index: 9999; display: flex; flex-direction: column; gap: 0.75rem"></div>

  <script>
    function vfNotify(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      const icon = type === 'success' ? 'check-circle' : type === 'danger' ? 'warning-circle' : 'info';
      toast.innerHTML = `
        <div class="toast-content">
          <i class="ph ph-${icon}"></i>
          <span>${message}</span>
        </div>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(20px)';
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }
  </script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
